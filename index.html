<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no,
                   viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="black-translucent">

    <meta name="mobile-web-app-capable"
          content="yes">

    <meta name="theme-color"
          content="#000000">

    <title>Jump Hero</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: black;

            touch-action: none;
            overscroll-behavior: none;
        }

        body {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            min-height: 100dvh;

            background: black;
        }

        #gameCanvas {
            position: fixed;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            min-height: 100dvh;

            display: block;

            background: black;

            touch-action: none;

            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        #rotateScreen {
            position: fixed;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            flex-direction: column;

            background: #111;
            color: white;

            z-index: 9999;

            font-family: Arial, sans-serif;

            text-align: center;

            padding: 30px;
        }

        #rotateScreen .phone {
            font-size: 70px;
            margin-bottom: 20px;
        }

        #rotateScreen h2 {
            font-size: 28px;
            margin: 0 0 10px;
        }

        #rotateScreen p {
            font-size: 18px;
            margin: 0;
            opacity: 0.8;
        }

        @media (max-width: 900px) and (orientation: portrait) {
            #rotateScreen {
                display: flex;
            }

            #gameCanvas {
                display: none;
            }
        }

        @media (orientation: landscape) {
            #rotateScreen {
                display: none;
            }

            #gameCanvas {
                display: block;
            }
        }
    </style>
</head>

<body>

    <canvas id="gameCanvas"></canvas>

    <div id="rotateScreen">
        <div class="phone">
            📱
        </div>

        <h2>
            Rotate your phone
        </h2>

        <p>
            Jump Hero works in landscape mode
        </p>
    </div>

    <script src="game.js"></script>

</body>
</html>
